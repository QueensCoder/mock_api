x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: etl/Dockerfile
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/1
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme-in-prod}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DUCKDB_PATH: /opt/airflow/duckdb/analytics.duckdb
  volumes:
    - ./etl/dags:/opt/airflow/dags
    - ./etl/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - duckdb_data:/opt/airflow/duckdb

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: celery_worker
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./worker:/app/worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info

  flower:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: flower
    ports:
      - "5555:5555"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: celery -A worker.celery_app flower --port=5555

  stream_consumer:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: stream_consumer
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./worker:/app/worker
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: python -m worker.stream_consumer
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Enable logical replication for CDC.
    # max_slot_wal_keep_size caps WAL retained per slot to 1 GB —
    # protects disk if Redpanda Connect falls behind.
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=4
        -c max_wal_senders=4
        -c max_slot_wal_keep_size=1024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Redis Stack adds RediSearch + RedisJSON on top of plain Redis.
    # API is 100% compatible — same port 6379, same redis-py client.
    # RedisInsight UI available on port 8001.
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda_connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: redpanda_connect
    volumes:
      - ./redpanda/pipeline.yaml:/pipeline.yaml:ro
    command: run /pipeline.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    environment:
      # Surface Redpanda Connect logs at info level
      CONNECT_LOG_LEVEL: INFO

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    container_name: migrate
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    # Runs once on every `make up` and exits.
    # For manual ops: docker compose run --rm migrate alembic downgrade -1

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Airflow ───────────────────────────────────────────────────────────────────
  # CeleryExecutor backed by the existing Redis (DB 1) and PostgreSQL.
  # airflow-init runs once to create the metadata DB, apply migrations, and
  # seed the admin user. All other Airflow containers wait for it to finish.

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: /opt/airflow/scripts/airflow_init.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-worker:
    <<: *airflow-common
    container_name: airflow_worker
    command: celery worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
  airflow_logs:
  duckdb_data:
