events {
    worker_connections 1024;
}

http {
    # Keep connections alive to the upstream (HTTP/1.1 keepalive)
    upstream fastapi {
        server app:8000;
        keepalive 32;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/html;

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Timeouts — generous for local dev; tighten in production
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;

        # Common proxy headers forwarded to FastAPI
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Use HTTP/1.1 + clear Connection header to enable keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # ── Routes ────────────────────────────────────────────────────────────

        # API
        location /api/ {
            proxy_pass http://fastapi;
        }

        # OpenAPI schema (consumed by Scalar, Postman, etc.)
        location /openapi.json {
            proxy_pass http://fastapi;
        }

        # Scalar API docs UI
        location /docs {
            proxy_pass http://fastapi;
        }

        # Health check — also useful for load-balancer probes
        location /api/v1/health {
            proxy_pass http://fastapi;
            access_log off;
        }

        # Catch-all — sends everything else to FastAPI too
        # Remove or restrict this in production
        location / {
            proxy_pass http://fastapi;
        }
    }
}
